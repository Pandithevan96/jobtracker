worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # ── WebSocket: proxy /app/* and /apps/* to Reverb (port 8080) ──────
        location ~ ^/(app|apps)/ {
            proxy_pass          http://127.0.0.1:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_cache_bypass  $http_upgrade;
            proxy_read_timeout  3600s;
        }

        # ── Reverb HTTP auth endpoint (/broadcasting/auth goes to PHP) ─────
        location /broadcasting/ {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  300s;
        }

        # ── Static assets ──────────────────────────────────────────────────
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── PHP via PHP built-in server on port 8000 ───────────────────────
        # We proxy ALL PHP requests to php artisan serve running on port 8000
        location / {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  300s;
        }
    }
}
