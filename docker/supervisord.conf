[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ─── 1. PHP artisan serve (HTTP API + SPA) ───────────────────────────────────
[program:php-serve]
command=php /var/www/html/artisan serve --host=127.0.0.1 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-serve.err.log
stdout_logfile=/var/log/supervisor/php-serve.out.log
priority=10

; ─── 2. Laravel Reverb (WebSocket server) ────────────────────────────────────
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/reverb.err.log
stdout_logfile=/var/log/supervisor/reverb.out.log
priority=20

; ─── 3. Nginx (public-facing proxy on port 80) ───────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=30
